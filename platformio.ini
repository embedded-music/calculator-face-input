[platformio]
core_dir = ../.platformio-home
src_dir = apps
default_envs = probe

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  m5stack/M5Unified@0.2.17

[env:probe]
build_src_filter =
  +<probe/src/>

[env:drum-step-sequencer]
build_src_filter =
  +<drum-step-sequencer/src/>
